<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoTrade P2P · App web</title>
<meta name="robots" content="noindex">
<!--
  2026-10-09: la app web de AutoTrade P2P (app.autotradep2p.com) se descontinuó y quedó
  archivada. Esta página ocupa su dirección para que los marcadores y enlaces viejos no den
  un error, sino que lleven a Telegram, donde se pide. index.html y 404.html son iguales: el
  404 cubre cualquier ruta antigua (/ajustes, /api/...).
-->
<meta http-equiv="refresh" content="0; url=https://t.me/AutoTradeP2P">
<link rel="canonical" href="https://t.me/AutoTradeP2P">
<script>location.replace('https://t.me/AutoTradeP2P')</script>
<style>
  :root { --lienzo: #eef1f5; --tinta: #0f1729; --suave: #475467; --acento: #2f63e6; --tarjeta: #ffffff; --borde: #d9dfe8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--lienzo); color: var(--tinta);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 440px; background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 20px; padding: 32px 28px; box-shadow: 0 12px 40px rgba(15, 23, 41, .08);
  }
  .marca { font-weight: 650; letter-spacing: -.01em; margin: 0 0 20px; }
  h1 { font-size: 24px; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 10px; }
  p { margin: 0 0 14px; color: var(--suave); }
  p[lang="en"] { font-size: 14px; }
  a.boton {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 8px;
    background: var(--acento); color: #fff; text-decoration: none; font-weight: 600;
    padding: 12px 20px; border-radius: 999px;
  }
  a.boton:focus-visible { outline: 3px solid rgba(47, 99, 230, .35); outline-offset: 3px; }
  svg { width: 20px; height: 20px; flex: none; }
</style>
</head>
<body>
<main>
  <p class="marca">AutoTrade P2P</p>
  <h1>La app web está en pausa.</h1>
  <p>Si quieres usarla, escríbenos por Telegram y lo vemos contigo.</p>
  <p lang="en">The web app is paused. If you would like to use it, write to us on Telegram.</p>
  <a class="boton" href="https://t.me/AutoTradeP2P" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 3 14.5 20.75 11 13 3.25 9.5Z"/><line x1="21" y1="3" x2="11" y2="13"/></svg>
    Ir a Telegram
  </a>
</main>
</body>
</html>
